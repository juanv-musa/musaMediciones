<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusaMediciones | Musaraña Gestión de Museos</title>
    
    <script>
        // CAPTURADOR GLOBAL DE ERRORES para mostrar en pantalla
        window.onerror = function(msg, url, line) {
            setTimeout(() => {
                const errDiv = document.getElementById('login-error');
                if (errDiv) {
                    errDiv.style.display = 'block';
                    errDiv.innerHTML += `<br><span style="font-size:10px;color:black;">ERR: ${msg} <br> ${url}:${line}</span>`;
                } else {
                    alert("ERR: " + msg);
                }
            }, 500);
            return false;
        };
        window.onclick = function(e) {
            if(e.target && e.target.id === 'btn-login') {
                if(!window.app) alert("app.js NO ha cargado correctamente.");
                else if(!window.firebase) alert("Firebase NO ha cargado.");
            }
        };
    </script>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Icons: Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="assets/logo.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }

        @media print {
            body { 
                background: white !important;
                color: black !important;
                font-family: 'Inter', sans-serif;
                font-size: 10pt;
            }
            .background-blobs, aside, .user-actions, .price-library, 
            #btn-save, #btn-export-excel, #btn-export-pdf, #btn-new-project-quick, 
            #add-measurement-btn, .add-item-btn, .chapter-actions,
            #measurement-panel, .ignore-print, #project-meta-editor {
                display: none !important;
            }

            #app {
                display: block !important;
                grid-template-columns: 1fr !important;
            }
            
            header {
                display: none !important;
            }

            main {
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }

            .view-container {
                display: none !important;
            }

            .glass {
                background: white !important;
                box-shadow: none !important;
                border: none !important;
            }

            /* Report Sections */
            .print-section {
                page-break-before: always;
                display: block !important;
            }
            .print-section:first-child {
                page-break-before: auto;
            }

            /* Professional Header (Matching Screenshot) */
            .print-header {
                display: block !important;
                margin-bottom: 40px;
                padding-bottom: 20px;
                text-transform: uppercase;
            }
            .print-header-title {
                font-size: 14pt;
                font-weight: 800;
                margin-bottom: 25px;
            }
            .print-header-item {
                display: flex;
                gap: 15px;
                margin-bottom: 8px;
                font-size: 9pt;
            }
            .print-header-label {
                width: 120px;
                font-weight: 700;
            }

            /* Summary Page */
            .summary-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 30px;
            }
            .summary-table th, .summary-table td {
                padding: 10px 0;
                text-align: right;
            }
            .summary-table td.desc {
                text-align: left;
                text-transform: uppercase;
            }

            /* Certification */
            .certification-text {
                margin: 40px 0;
                line-height: 1.8;
                font-weight: 600;
                text-transform: uppercase;
            }
            .signature-block {
                margin-top: 60px;
                text-align: right;
            }

        }

        .print-only, .print-section { display: none; }
    </style>
</head>
<body>

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="app">

                <img src="assets/logo.png" alt="Musaraña Logo" class="header-logo-img">
            </div>
            <div class="project-info" style="display: flex; align-items: center; gap: 1rem;">
                <span id="current-project-name" contenteditable="true" style="font-weight: 700; color: var(--text-primary); font-size: 1.1rem; padding: 2px 8px; border-radius: 4px; border: 1px dashed transparent; transition: all 0.2s;">Sin Proyecto</span>
                <span id="total-budget-badge" class="glass" style="padding: 0.5rem 1.2rem; border-radius: 50px; font-size: 0.95rem; font-weight: 700; color: var(--primary);">
                    Total: <span id="project-total-val">0,00</span>€
                </span>
            </div>
            <div class="user-actions" style="display: flex; gap: 1rem;">
                <button id="btn-export-pdf" class="btn-musa" style="background: white; color: #ef4444; border: 1px solid #fee2e2;">
                    PDF Multihola
                </button>
                <button id="btn-export-excel" class="btn-musa" style="background: white; color: #059669; border: 1px solid #dcfce7;">
                    Excel (.xlsx)
                </button>
                <button id="btn-new-project-quick" class="btn-musa" title="Nuevo Presupuesto" style="background: white; border: 1px solid var(--border); color: var(--text-secondary);">
                    <i data-lucide="plus" style="width: 18px;"></i>
                </button>

                <button id="btn-logout" class="btn-musa" title="Cerrar Sesión" style="background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c;">
                    <i data-lucide="log-out" style="width: 18px;"></i>
                </button>

        <aside class="glass">
            <nav id="sidebar-nav">
                <ul>
                    <li><a href="#portfolio" class="nav-item active" data-view="portfolio">
                        <i data-lucide="pie-chart"></i>
                        <span class="nav-text">Visión Global</span>
                    </a></li>
                    <li><a href="#dashboard" class="nav-item" data-view="dashboard">
                        <i data-lucide="layout-dashboard"></i>
                        <span class="nav-text">Dashboard Proyecto</span>
                    </a></li>
                    <li><a href="#projects" class="nav-item" data-view="projects">
                        <i data-lucide="folder-kanban"></i>
                        <span class="nav-text">Mis Proyectos</span>
                    </a></li>
                    <li><a href="#clients" class="nav-item" data-view="clients">
                        <i data-lucide="users"></i>
                        <span class="nav-text">Clientes</span>
                    </a></li>
                    <li><hr style="border: none; border-top: 1px solid var(--border); margin: 0.5rem 0;"></li>
                    <li><a href="#budget" class="nav-item" data-view="budget">
                        <i data-lucide="calculator"></i>
                        <span class="nav-text">Presupuesto</span>
                    </a></li>
                    <li><a href="#planning" class="nav-item" data-view="planning">
                        <i data-lucide="calendar-range"></i>

            <div class="quick-stats" style="margin-top: auto; padding: 1.2rem; border-radius: var(--radius-lg); background: white; border: 1px solid var(--border);">
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.6rem; font-weight: 700; text-transform: uppercase;">Progreso PEM</div>

        <main id="main-content">

            <div id="view-dashboard" class="view-container" style="display: none;"></div>
            <div id="view-projects" class="view-container" style="display: none;"></div>

    <!-- Login Overlay -->
    <div id="login-overlay" style="position: fixed; inset: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem; animation: fadeIn 0.3s ease;">
        <img src="assets/logo.png" alt="Musaraña" style="width: 150px; margin-bottom: 1rem;">
        <h2 style="font-weight: 800; color: var(--primary);">MusaMediciones Cloud</h2>
        <div style="background: white; padding: 2rem; border-radius: var(--radius-xl); box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Inicia sesión para entrar a tu cuenta en la nube.</p>
            
            <input type="email" id="login-email" placeholder="Correo Electrónico" style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 0.8rem; font-size: 1rem; text-align: center;">
            
            <div id="login-hint" style="font-size: 0.75rem; color: var(--text-muted); margin-top: -0.4rem; margin-bottom: 0.8rem; display: none; line-height: 1.4; padding: 0.6rem; border-radius: 8px; background: #f8fafc; border: 1px solid var(--border); text-align: left;"></div>
            
            <input type="password" id="login-key" placeholder="Contraseña" style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1rem; font-size: 1rem; text-align: center;">
            
            <button id="btn-login" onclick="window.emergencyLogin()" class="btn-musa" style="width: 100%; padding: 1rem; font-weight: 600;">Entrar</button>
            
            <div style="margin-top: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;">
                <a id="btn-reset-password" href="#" onclick="event.preventDefault(); window.emergencyPasswordReset()" style="color: var(--primary); font-size: 0.85rem; text-decoration: none; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">¿Olvidaste tu contraseña?</a>
            </div>

            <div id="login-error" style="color: #ef4444; font-size: 0.8rem; margin-top: 1rem; display: none;">Clave incorrecta. Inténtalo de nuevo.</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/firebase-config.js?v=4"></script>
    <script type="module">
        console.log("MusaApp: Iniciando carga de Firebase SDK...");
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        window.firebase = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail, getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, query, where, onSnapshot };
        console.log("MusaApp: Firebase SDK cargado correctamente.");

        // Intentar recuperar el último email guardado por Firebase en IndexedDB
        async function getSavedEmail() {
            return new Promise((resolve) => {
                try {
                    const req = indexedDB.open("firebaseLocalStorageDb");
                    req.onerror = () => resolve(null);
                    req.onsuccess = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains("firebaseLocalStorage")) {
                            resolve(null);
                            return;
                        }
                        const tx = db.transaction(["firebaseLocalStorage"], "readonly");
                        const store = tx.objectStore("firebaseLocalStorage");
                        const getAllReq = store.getAll();
                        getAllReq.onsuccess = () => {
                            const data = getAllReq.result;
                            if (data && data.length > 0) {
                                for (const item of data) {
                                    if (item && item.value && item.value.email) {
                                        resolve(item.value.email);
                                        return;
                                    }
                                }
                            }
                            resolve(null);
                        };
                        getAllReq.onerror = () => resolve(null);
                    };
                } catch (e) {
                    resolve(null);
                }
            });
        }

        // Pre-cargar el último correo si existe
        document.addEventListener("DOMContentLoaded", async () => {
            setTimeout(async () => {
                const emailInput = document.getElementById('login-email');
                if (emailInput) {
                    const savedEmail = await getSavedEmail();
                    if (savedEmail) {
                        emailInput.value = savedEmail;
                        const hintDiv = document.getElementById('login-hint');
                        if (hintDiv) {
                            hintDiv.style.display = 'block';
                            hintDiv.innerHTML = `💡 <strong>Sugerencia:</strong> Tu última sesión activa fue con <strong style="color: var(--primary);">${savedEmail}</strong>.`;
                        }
                    }
                }
            }, 500);
        });

        window.emergencyLogin = async function() {
            console.log("MusaApp: BOTÓN PULSADO (Emergencia)");
            if (!window.firebase) { alert("Error: Firebase no ha cargado correctamente."); return; }
            if (!window.state) { alert("Error: El estado de la app (state.js) no está disponible."); return; }
            
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-key').value.trim();
            
            if (!email || !pass) { alert("Por favor, introduce tu correo y contraseña."); return; }
            
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = "Conectando...";

            try {
                if (!window.state.auth) window.state.initFirebaseAppOnly();
                const auth = window.state.auth;
                await window.firebase.signInWithEmailAndPassword(auth, email, pass);
                alert("¡Login con éxito! Entrando...");
                location.reload(); 
            } catch (e) {
                btn.disabled = false;
                btn.textContent = "Entrar";
                console.error("MusaApp: Error de emergencia:", e);
                alert("Error en el login: " + e.message);
            }
        };

        window.emergencyPasswordReset = async function() {
            const emailInput = document.getElementById('login-email');
            const email = emailInput.value.trim();
            if (!email) {
                alert("Por favor, introduce tu correo electrónico en el campo superior para enviarte el enlace de restablecimiento.");
                emailInput.focus();
                return;
            }
            
            if (!confirm(`¿Enviar un correo para restablecer la contraseña a: ${email}?`)) {
                return;
            }

            if (!window.firebase) { alert("Error: Firebase no ha cargado correctamente."); return; }
            if (!window.state) { alert("Error: El estado de la app (state.js) no está disponible."); return; }

            const btnReset = document.getElementById('btn-reset-password');
            const oldText = btnReset.textContent;
            btnReset.textContent = "Enviando enlace...";
            btnReset.style.pointerEvents = 'none';

            try {
                if (!window.state.auth) window.state.initFirebaseAppOnly();
                const auth = window.state.auth;
                await window.firebase.sendPasswordResetEmail(auth, email);
                alert(`¡Correo enviado! Revisa la bandeja de entrada de ${email} para restablecer tu contraseña.`);
            } catch (e) {
                console.error("MusaApp: Error restableciendo contraseña:", e);
                alert("Error al enviar el correo de restablecimiento: " + e.message);
            } finally {
                btnReset.textContent = oldText;
                btnReset.style.pointerEvents = 'auto';
            }
        };
    </script>
    <!-- SheetJS para exportación XLSX -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="js/state.js?v=6" defer></script>
    <script src="js/components/portfolio.js?v=7" defer></script>
    <script src="js/components/dashboard.js?v=6" defer></script>
    <script src="js/components/budget.js?v=6" defer></script>
    <script src="js/components/project-manager.js?v=6" defer></script>
    <script src="js/components/client-manager.js?v=6" defer></script>
    <script src="js/components/gantt.js?v=6" defer></script>
    <script src="js/app.js?v=6" defer></script>
</body>
</html>
